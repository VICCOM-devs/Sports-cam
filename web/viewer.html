<!doctype html>
<html lang="sv" data-build="{{BUILD}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0C10">
<title>Sports Cam – Live</title>
<link rel="stylesheet" href="/css/tokens.css?v={{BUILD}}">
<link rel="stylesheet" href="/css/app.css?v={{BUILD}}">
<style>
  .player { position: relative; background: #000; aspect-ratio: 16 / 9; overflow: hidden; }
  .player video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity var(--t-base) var(--ease); }
  .player video.on { opacity: 1; }
  .player .empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: var(--s5); color: var(--text-dim); }
  .player .badge { position: absolute; top: var(--s3); left: var(--s3); }
  .player .angle-name { position: absolute; top: var(--s3); right: var(--s3); font-size: var(--small); font-weight: 700; background: rgba(10,12,16,.7); padding: 4px 10px; border-radius: 999px; }
  .player .overlay-score { position: absolute; left: var(--s3); bottom: var(--s3); display: flex; align-items: center; gap: var(--s2); background: rgba(10,12,16,.78); backdrop-filter: blur(8px); border-radius: var(--r-chip); padding: 6px 10px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .angles { display: flex; gap: var(--s2); overflow-x: auto; padding: var(--s3) var(--s4); scroll-snap-type: x mandatory; scrollbar-width: none; }
  .angles::-webkit-scrollbar { display: none; }
  .angle { flex: none; scroll-snap-align: start; min-width: 132px; min-height: var(--target); border-radius: var(--r-card); border: 1px solid var(--stroke); background: var(--surface-1); padding: var(--s2) var(--s3); text-align: left; display: grid; gap: 2px; transition: border-color var(--t-fast); }
  .angle.on { border-color: var(--accent); background: var(--accent-soft); }
  .angle .name { font-weight: 700; font-size: var(--small); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .angle .meta { font-size: 11px; color: var(--text-dim); }
  .angle.dead { opacity: .45; }
  .tags { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); padding: 0 var(--s4); }
  .tag { min-height: var(--target); border-radius: var(--r-card); border: 1px solid var(--stroke); background: var(--surface-2); font-weight: 700; display: grid; place-items: center; }
  .tag.primary { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .tag.home { border-color: var(--home); } .tag.away { border-color: var(--away); }
  .events { padding: var(--s4); display: grid; gap: var(--s2); }
  .event { display: flex; gap: var(--s3); align-items: center; padding: var(--s3) var(--s4); background: var(--surface-1); border: 1px solid var(--stroke); border-radius: var(--r-card); animation: enter var(--t-base) var(--ease); }
  @keyframes enter { from { opacity: 0; transform: translateY(6px); } }
  .event .t { font-variant-numeric: tabular-nums; color: var(--text-dim); font-size: var(--small); min-width: 44px; }
  .event .k { font-weight: 700; }
  .control { padding: 0 var(--s4) var(--s4); display: grid; gap: var(--s2); }
  .control .scorerow { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }
  .tabs { display: flex; gap: var(--s2); padding: var(--s3) var(--s4) 0; }
  .tabs .btn { min-height: 44px; flex: 1; padding: 0 var(--s2); font-size: var(--small); }
  .tabs .btn.on { border-color: var(--accent); background: var(--accent-soft); }
  .pane.hidden { display: none; }
  .rinkmap { width: 100%; background: var(--surface-1); border-radius: var(--r-card); border: 1px solid var(--stroke); }
  .rinkmap .ice { fill: #0f1a24; stroke: var(--stroke); stroke-width: .3; }
  .rinkmap .line { stroke: var(--text-faint); stroke-width: .25; }
  .rinkmap .blue { stroke: #3b6fd8; } .rinkmap .red { stroke: #c23b4a; }
  .rinkmap .p { stroke: #000; stroke-width: .25; transition: cx var(--t-base) linear, cy var(--t-base) linear; }
  .rinkmap .p.ref { fill: #ddd; }
  .rinkmap .lbl { font: 700 1.6px var(--font); fill: #fff; text-anchor: middle; paint-order: stroke; stroke: #000; stroke-width: .4px; pointer-events: none; }
  .players { display: grid; gap: var(--s2); }
  .clips { display: grid; gap: var(--s3); }
  .clip { background: var(--surface-1); border: 1px solid var(--stroke); border-radius: var(--r-card); overflow: hidden; }
  .clip video { width: 100%; aspect-ratio: 16 / 9; background: #000; display: block; }
  .clip .meta { display: flex; gap: var(--s2); align-items: center; padding: var(--s2) var(--s3); font-size: var(--small); }
  .angle.auto .name { color: var(--accent); }
  .prow { display: grid; grid-template-columns: 10px 1fr auto auto; gap: var(--s3); align-items: center; padding: var(--s3) var(--s4); background: var(--surface-1); border: 1px solid var(--stroke); border-radius: var(--r-card); }
  .prow .num { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
  .prow .u { font-size: 11px; color: var(--text-faint); display: block; text-align: right; }
  @media (min-width: 900px) {
    .layout { display: grid; grid-template-columns: 1fr 360px; gap: var(--s4); max-width: 1200px; margin: 0 auto; padding: var(--s4); }
    .side { border-left: 1px solid var(--stroke); }
  }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">VICCOM <span>Sports Cam</span></span>
  <span class="grow"></span>
  <span id="net" class="chip offline hidden" data-i18n="view.offline"></span>
  <span id="viewers" class="chip faint"></span>
</header>

<div class="layout">
  <section class="main">
    <div class="tabs" id="tabs">
      <button class="btn on" data-pane="live" data-i18n="view.tab.live"></button>
      <button class="btn" data-pane="rink" data-i18n="view.tab.rink"></button>
      <button class="btn" data-pane="players" data-i18n="view.tab.players"></button>
      <button class="btn" data-pane="clips" data-i18n="view.tab.clips"></button>
    </div>
    <div class="pane hidden" id="pane-clips" style="padding: var(--s3) var(--s4)">
      <div class="row" style="margin-bottom: var(--s3)"><span class="chip faint hidden" id="clipsbuilding" data-i18n="view.clips.building"></span><span class="grow"></span><button class="btn hidden" id="buildclips" style="min-height:44px" data-i18n="view.clips.build"></button></div>
      <div class="clips" id="clips"></div>
      <p class="dim" id="clipsempty" data-i18n="view.clips.empty"></p>
    </div>

    <div class="pane hidden" id="pane-rink" style="padding: var(--s3) var(--s4)">
      <svg class="rinkmap" id="rinkmap" viewBox="-32 -17 64 34"></svg>
      <p class="dim hidden" id="rinkempty" style="margin-top: var(--s2)" data-i18n="view.rink.empty"></p>
    </div>
    <div class="pane hidden" id="pane-players" style="padding: var(--s3) var(--s4)">
      <div class="players" id="players"></div>
      <p class="dim" id="playersempty" data-i18n="view.players.empty"></p>
    </div>

    <div class="pane" id="pane-live">
    <div class="player" id="player">
      <video id="v0" autoplay playsinline muted></video>
      <video id="v1" autoplay playsinline muted></video>
      <div class="empty" id="empty"><div class="stack" style="gap: var(--s2)"><div class="skeleton" style="width:120px;height:14px;margin:0 auto"></div><p data-i18n="view.waiting"></p></div></div>
      <span class="chip live badge" id="livebadge" data-i18n="view.live"></span>
      <span class="angle-name" id="anglename"></span>
      <div class="overlay-score" id="oscore"><span class="swatch" id="o-hs"></span><span id="o-h">0</span><span class="faint">–</span><span id="o-a">0</span><span class="swatch" id="o-as"></span><span class="faint" id="o-clock">00:00</span></div>
    </div>

    <div class="angles" id="angles"></div>

    <div class="card scoreboard" style="margin: 0 var(--s4) var(--s3)">
      <div class="team home"><span class="swatch" id="hs"></span><span class="name" id="home"></span></div>
      <div class="stack" style="gap: 2px; text-align: center"><div class="score"><span id="score-h">0</span> – <span id="score-a">0</span></div><div class="clock"><span data-i18n="view.period"></span> <span id="period">1</span> · <span id="clock">00:00</span></div></div>
      <div class="team away"><span class="name" id="away"></span><span class="swatch" id="as"></span></div>
    </div>

    <div id="control" class="control hidden">
      <button id="startgame" class="btn primary block" data-i18n="score.start"></button>
      <div class="scorerow">
        <button id="clockbtn" class="btn" data-i18n="score.clock.start"></button>
        <button id="periodbtn" class="btn" data-i18n="score.period"></button>
      </div>
      <div class="scorerow">
        <button id="plus-h" class="btn" style="border-color: var(--home)"><span id="plus-h-name"></span> +1</button>
        <button id="plus-a" class="btn" style="border-color: var(--away)"><span id="plus-a-name"></span> +1</button>
      </div>
    </div>

    <div class="tags" id="tags"></div>
    </div>
  </section>

  <aside class="side">
    <div class="events">
      <div class="label" data-i18n="view.events"></div>
      <div id="eventlist" class="stack" style="gap: var(--s2)"><p class="dim" id="noevents" data-i18n="view.noevents"></p></div>
    </div>
  </aside>
</div>

<script type="module">
import { loadI18n, t, api, session, saveSession, codeFromUrl, haptic, toast, fmtClock, updateGate, watchForNewBuild } from "/js/core.js?v={{BUILD}}";
import { play } from "/js/rtc.js?v={{BUILD}}";
import { connectLive } from "/js/live.js?v={{BUILD}}";
await loadI18n();
updateGate(); watchForNewBuild();

const $ = (id) => document.getElementById(id);
const code = codeFromUrl();
let sess = session();
const urlTok = new URLSearchParams(location.search).get("t");
if (urlTok) { sess = { token: urlTok, role: "admin", code }; saveSession(sess); }
else if (!sess || (code && sess.code !== code) || sess.role === "camera") {
  try {
    const j = await api("/api/join", { method: "POST", body: { code, role: "viewer" } });
    sess = { token: j.token, role: "viewer", code: j.match.code, matchId: j.match.id };
    saveSession(sess);
  } catch { location.href = `/?c=${code}`; }
}
const canScore = sess.role === "scorekeeper" || sess.role === "admin";

// ---------- state ----------
let state = null, clockBase = 0, clockAt = 0;
function applyState(st) {
  state = st;
  document.documentElement.style.setProperty("--home", st.home_color);
  document.documentElement.style.setProperty("--away", st.away_color);
  for (const id of ["hs", "o-hs"]) $(id).style.background = st.home_color;
  for (const id of ["as", "o-as"]) $(id).style.background = st.away_color;
  $("home").textContent = st.home; $("away").textContent = st.away;
  $("plus-h-name").textContent = st.home; $("plus-a-name").textContent = st.away;
  $("score-h").textContent = $("o-h").textContent = st.home_score;
  $("score-a").textContent = $("o-a").textContent = st.away_score;
  $("period").textContent = st.period;
  $("viewers").textContent = `${st.viewers} ${t("lobby.viewers")}`;
  clockBase = st.clock_ms; clockAt = performance.now(); clockRunning = st.clock_running;
  $("livebadge").classList.toggle("hidden", st.status !== "live");
  if (canScore) {
    $("control").classList.remove("hidden");
    $("startgame").classList.toggle("hidden", st.status !== "lobby");
    $("clockbtn").textContent = st.clock_running ? t("score.clock.stop") : t("score.clock.start");
    $("clockbtn").disabled = $("periodbtn").disabled = $("plus-h").disabled = $("plus-a").disabled = st.status !== "live";
  }
  renderAngles(st.cameras);
  if (st.status === "ended") toast(t("view.ended"));
}
let clockRunning = false;
setInterval(() => {
  const ms = clockBase + (clockRunning ? performance.now() - clockAt : 0);
  $("clock").textContent = $("o-clock").textContent = fmtClock(ms);
}, 250);

// ---------- angles & player ----------
const videos = [$("v0"), $("v1")]; let front = 0; let current = null, conn = null, switching = false;
let autoDirector = true, directorCam = null;
function renderAngles(cams) {
  const wrap = $("angles");
  const liveCams = cams.filter((c) => c.status !== "offline");
  wrap.innerHTML = "";
  if (liveCams.filter((c) => c.live).length > 1) {
    const a = document.createElement("button");
    a.className = "angle auto" + (autoDirector ? " on" : "");
    a.innerHTML = `<span class="name"></span><span class="meta"></span>`;
    a.querySelector(".name").textContent = t("view.auto");
    a.querySelector(".meta").textContent = t("view.auto.hint");
    a.onclick = () => { haptic(); autoDirector = true; renderAngles(state.cameras); if (directorCam) switchTo(state.cameras.find((c) => c.id === directorCam)); };
    wrap.appendChild(a);
  }
  for (const c of liveCams) {
    const b = document.createElement("button");
    b.className = "angle" + (c.id === current && !autoDirector ? " on" : "") + (c.live ? "" : " dead");
    b.innerHTML = `<span class="name"></span><span class="meta"></span>`;
    b.querySelector(".name").textContent = c.label;
    b.querySelector(".meta").textContent = c.live ? `● ${t("status.live")} · ${c.viewers}` : t(`status.${c.status}`);
    b.disabled = !c.live;
    b.onclick = () => { haptic(); autoDirector = false; switchTo(c); renderAngles(state.cameras); };
    wrap.appendChild(b);
  }
  const anyLive = liveCams.some((c) => c.live);
  $("empty").classList.toggle("hidden", anyLive && !!current);
  $("empty").querySelector("p").textContent = liveCams.length ? t("view.waiting") : t("view.nocams");
  if (!current && anyLive) switchTo(liveCams.find((c) => c.live));
  if (current && !liveCams.some((c) => c.id === current && c.live)) { current = null; conn?.stop(); conn = null; videos.forEach((v) => v.classList.remove("on")); const next = liveCams.find((c) => c.live); if (next) switchTo(next); else $("empty").classList.remove("hidden"); }
}
async function switchTo(cam) {
  if (!cam || cam.id === current || switching) return;
  switching = true;
  const back = videos[1 - front];
  try {
    const next = await play(cam.id, back, sess.token);
    await new Promise((res) => { back.onplaying = res; setTimeout(res, 1500); });
    back.classList.add("on"); videos[front].classList.remove("on");
    const old = conn; conn = next; front = 1 - front; current = cam.id;
    setTimeout(() => old?.stop(), 300);
    $("anglename").textContent = cam.label;
    $("empty").classList.add("hidden");
    document.querySelectorAll(".angle:not(.auto)").forEach((b) => b.classList.toggle("on", !autoDirector && b.querySelector(".name").textContent === cam.label));
    next.pc.onconnectionstatechange = () => { if (["failed", "disconnected"].includes(next.pc.connectionState) && current === cam.id) { toast(t("view.reconnect")); current = null; switchTo(cam); } };
  } catch (e) { toast(t("err.generic")); }
  finally { switching = false; }
}
// tap video to unmute (autoplay policy)
$("player").onclick = () => videos.forEach((v) => (v.muted = false));

// ---------- tags ----------
const TAGS = canScore ? ["highlight", "goal", "shot", "save", "hit", "penalty"] : ["highlight"];
const tagsEl = $("tags");
for (const k of TAGS) {
  const b = document.createElement("button"); b.className = "tag" + (k === "highlight" ? " primary" : ""); b.textContent = t(`view.tag.${k}`);
  b.onclick = async () => {
    haptic("medium"); b.style.transform = "scale(.95)"; setTimeout(() => (b.style.transform = ""), 120);
    let team = null;
    if (canScore && ["goal", "shot", "save", "hit", "penalty"].includes(k)) team = await pickTeam();
    if (team === undefined) return;
    try { await api("/api/events", { method: "POST", token: sess.token, body: { kind: k, team, payload: { camera: current } } }); toast(`${t("view.tagged")}: ${t(`view.tag.${k}`)}`); }
    catch { toast(t("err.generic")); }
  };
  tagsEl.appendChild(b);
}
if (TAGS.length === 1) tagsEl.style.gridTemplateColumns = "1fr";
function pickTeam() {
  return new Promise((res) => {
    const s = document.createElement("div"); s.className = "sheet";
    s.innerHTML = `<div class="stack"><div class="scorerow" style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><button class="btn" data-t="home" style="border-color:var(--home)"></button><button class="btn" data-t="away" style="border-color:var(--away)"></button></div><button class="btn ghost" data-t=""></button></div>`;
    s.querySelector('[data-t="home"]').textContent = state.home; s.querySelector('[data-t="away"]').textContent = state.away; s.querySelector('[data-t=""]').textContent = t("close");
    s.querySelectorAll("button").forEach((b) => (b.onclick = () => { s.remove(); res(b.dataset.t || undefined); }));
    document.body.appendChild(s);
  });
}

// ---------- scorekeeper controls ----------
if (canScore) {
  const post = (p, body) => api(p, { method: "POST", token: sess.token, body }).catch(() => toast(t("err.generic")));
  $("startgame").onclick = () => { haptic("medium"); post("/api/match/start"); };
  $("clockbtn").onclick = () => { haptic("medium"); post("/api/match/clock", { running: !state.clock_running }); };
  $("periodbtn").onclick = () => { haptic("medium"); post("/api/match/score", { period: state.period + 1 }); };
  $("plus-h").onclick = () => { haptic("heavy"); post("/api/match/score", { home_score: state.home_score + 1 }); };
  $("plus-a").onclick = () => { haptic("heavy"); post("/api/match/score", { away_score: state.away_score + 1 }); };
}

// ---------- events list ----------
const list = $("eventlist");
function addEvent(ev, prepend = true) {
  $("noevents")?.remove();
  const el = document.createElement("div"); el.className = "event";
  const label = ev.kind === "score" ? `${ev.payload.home}–${ev.payload.away}` : ev.kind === "period" ? `${t("view.period")} ${ev.payload.period}` : t(`view.tag.${ev.kind}`);
  const teamName = ev.team === "home" ? state?.home : ev.team === "away" ? state?.away : "";
  el.innerHTML = `<span class="t"></span><span class="swatch" style="visibility:${ev.team ? "visible" : "hidden"};background:var(--${ev.team || "home"})"></span><span class="k"></span><span class="dim grow"></span>`;
  el.querySelector(".t").textContent = fmtClock(ev.t_ms); el.querySelector(".k").textContent = label; el.querySelector(".dim").textContent = teamName || "";
  prepend ? list.prepend(el) : list.append(el);
}

// ---------- tabs ----------
let pane = "live";
document.querySelectorAll("#tabs .btn").forEach((b) => (b.onclick = () => {
  pane = b.dataset.pane; haptic();
  document.querySelectorAll("#tabs .btn").forEach((x) => x.classList.toggle("on", x === b));
  document.querySelectorAll(".pane").forEach((p) => p.classList.toggle("hidden", p.id !== `pane-${pane}`));
  if (pane === "players") refreshStats();
  if (pane === "clips") refreshClips();
}));

// ---------- rink map ----------
let rink = null;
const rinkSvg = $("rinkmap");
let dotsLayer;
async function drawRinkBase() {
  rink = await api("/api/rink");
  const o = rink.outline.map(([x, y]) => `${x},${-y}`).join(" ");
  let s = `<polygon class="ice" points="${o}"/>`;
  for (const [[x1, y1], [x2, y2]] of rink.lines) {
    const cls = Math.abs(x1) < 1 ? "red" : Math.abs(x1) < 10 ? "blue" : "red";
    s += `<line class="line ${cls}" x1="${x1}" y1="${-y1}" x2="${x2}" y2="${-y2}"/>`;
  }
  s += `<g id="dots"></g>`;
  rinkSvg.innerHTML = s; dotsLayer = rinkSvg.querySelector("#dots");
}
const dots = new Map();
function applyPositions(data) {
  if (data.director && data.director !== directorCam) {
    directorCam = data.director;
    if (autoDirector) { const c = state?.cameras.find((x) => x.id === directorCam && x.live); if (c) switchTo(c); }
  }
  if (!dotsLayer) return;
  const seen = new Set();
  for (const p of data.players) {
    seen.add(p.id);
    let g = dots.get(p.id);
    if (!g) {
      g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.innerHTML = `<circle class="p" r="1"/><text class="lbl" dy="-1.6"></text>`;
      dotsLayer.appendChild(g); dots.set(p.id, g);
    }
    const c = g.querySelector("circle"); c.setAttribute("cx", p.x); c.setAttribute("cy", -p.y);
    c.setAttribute("fill", p.team === "home" ? state.home_color : p.team === "away" ? state.away_color : "#ddd");
    const tx = g.querySelector("text"); tx.setAttribute("x", p.x); tx.setAttribute("y", -p.y);
    tx.textContent = p.label || (p.speed_kmh > 3 ? `${Math.round(p.speed_kmh)}` : "");
  }
  for (const [id, g] of dots) if (!seen.has(id)) { g.remove(); dots.delete(id); }
  $("rinkempty").classList.toggle("hidden", data.players.length > 0 || state?.vision?.players > 0);
}

// ---------- players / stats ----------
async function refreshStats() {
  try {
    const r = await api("/api/stats", { token: sess.token });
    const list = $("players"); list.innerHTML = "";
    const players = (r.players || []).filter((p) => p.time_tracked_s >= 3).sort((a, b) => b.distance_m - a.distance_m);
    $("playersempty").classList.toggle("hidden", players.length > 0);
    for (const p of players) {
      const el = document.createElement("div"); el.className = "prow";
      const col = p.team === "home" ? state.home_color : p.team === "away" ? state.away_color : "#ddd";
      el.innerHTML = `<span class="swatch" style="background:${col}"></span><span></span><span class="num"></span><span class="num"></span>`;
      el.children[1].textContent = p.label || (p.team ? `#${p.id} · ${t(`team.${p.team}`)}` : `#${p.id}`);
      const dist = p.distance_m >= 1000 ? `${(p.distance_m / 1000).toFixed(2)} km` : `${Math.round(p.distance_m)} m`;
      el.children[2].innerHTML = `${dist}<span class="u">${t("stat.distance")}</span>`;
      el.children[3].innerHTML = `${p.top_speed_kmh.toFixed(0)} km/h<span class="u">${t("stat.topspeed")}</span>`;
      list.appendChild(el);
    }
  } catch { /* keep old */ }
}
drawRinkBase();
setInterval(() => { if (pane === "players") refreshStats(); if (pane === "clips") refreshClips(); }, 3000);

// ---------- clips ----------
async function refreshClips() {
  try {
    const r = await api("/api/clips", { token: sess.token });
    $("clipsbuilding").classList.toggle("hidden", !r.building);
    $("buildclips").classList.toggle("hidden", !canScore || r.building);
    $("clipsempty").classList.toggle("hidden", r.clips.length > 0 || r.building);
    const list = $("clips");
    const have = new Set([...list.querySelectorAll(".clip")].map((e) => e.dataset.id));
    for (const c of r.clips) {
      if (have.has(String(c.event_id))) continue;
      const el = document.createElement("div"); el.className = "clip"; el.dataset.id = c.event_id;
      el.innerHTML = `<video controls playsinline preload="metadata"></video><div class="meta"><span class="swatch" style="visibility:${c.team ? "visible" : "hidden"};background:var(--${c.team || "home"})"></span><b></b><span class="dim"></span><span class="grow"></span><span class="faint mono"></span></div>`;
      el.querySelector("video").src = `/clips/${c.file}?t=${encodeURIComponent(sess.token)}`;
      el.querySelector("b").textContent = t(`view.tag.${c.kind}`);
      el.querySelector(".dim").textContent = c.camera;
      el.querySelector(".faint").textContent = fmtClock(c.t_ms);
      list.appendChild(el);
    }
  } catch { /* keep */ }
}
$("buildclips").onclick = () => { haptic("medium"); api("/api/clips/build", { method: "POST", token: sess.token }).then(refreshClips).catch(() => toast(t("err.generic"))); };

// ---------- boot ----------
try {
  const full = await api("/api/match", { token: sess.token });
  if (full.role !== sess.role) { sess.role = full.role; saveSession(sess); location.reload(); }
  applyState(full);
  for (const ev of full.events) addEvent(ev, true);
} catch { toast(t("err.generic")); }
connectLive(sess.token, {
  onState: applyState,
  onEvent: (ev) => addEvent(ev),
  onPositions: applyPositions,
  onStatus: (s) => $("net").classList.toggle("hidden", s === "online"),
});
</script>
</body>
</html>
